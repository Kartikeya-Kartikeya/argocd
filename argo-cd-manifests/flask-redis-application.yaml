apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-redis-demo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/YOUR_USER/YOUR_REPO.git
    targetRevision: main
    path: helm chart/flask-redis-demo
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true