apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.flask.service.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: flask-app
spec:
  type: ClusterIP
  selector:
    app: flask-app
  ports:
    - name: http
      port: {{ .Values.flask.service.port }}
      targetPort: {{ .Values.flask.service.targetPort }}